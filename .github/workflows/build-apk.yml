name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build-debug.log
          exit ${PIPESTATUS[0]}

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build-release.log
          exit ${PIPESTATUS[0]}
        continue-on-error: true

      - name: Show Build Errors
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== 编译错误汇总 ==="
          ERROR_LINES=$(grep -E "^e:|error:|FAILURE:|What went wrong" build-debug.log 2>/dev/null | head -80 || echo "No error patterns found")
          echo "$ERROR_LINES"
          echo ""
          echo "=== 构建日志最后 200 行 ==="
          tail -200 build-debug.log 2>/dev/null || echo "No build-debug.log found"
          # 将编译错误行 + 日志尾部作为 commit comment 发布
          LOG_TAIL=$(tail -100 build-debug.log 2>/dev/null || echo "No build-debug.log found")
          jq -n --arg body "## 编译错误汇总

          \`\`\`
          $ERROR_LINES
          \`\`\`

          ## Build Log (last 100 lines)

          \`\`\`
          $LOG_TAIL
          \`\`\`" '{body: $body}' > /tmp/payload.json
          curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            -d @/tmp/payload.json

      - name: List APK files
        if: always()
        run: |
          echo "=== All APK files ==="
          find app/build/outputs/apk -name "*.apk" -type f 2>/dev/null || echo "No APK files found"
          echo "=== Debug APK ==="
          ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "No debug APK directory"
          echo "=== Release APK ==="
          ls -la app/build/outputs/apk/release/ 2>/dev/null || echo "No release APK directory"

      - name: Upload Build Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            **/*.log
            **/build/reports/**
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zhuiju-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zhuiju-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
